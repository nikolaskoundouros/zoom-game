<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoom game</title>
<style>
  :root { --bg:#14120f; --panel:#1f1b16; --line:#3a332a; --text:#efe7d8; --muted:#a39884; --accent:#e8a33d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  .wrap { display:flex; gap:20px; padding:16px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
  .phone { position:relative; width:360px; height:640px; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#000; flex:none; }
  .phone canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  .hud { position:absolute; left:8px; bottom:8px; right:8px; display:flex; justify-content:space-between; font-size:12px; color:#fff; text-shadow:0 1px 3px #000; pointer-events:none; }
  .guide { position:absolute; inset:0; pointer-events:none; background:
    linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.25) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.25) 66.6%, transparent 66.8%),
    linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.25) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.25) 66.6%, transparent 66.8%); }
  .panel { width:420px; max-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  h1 { font-size:18px; margin:0 0 2px; font-weight:600; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; font-weight:600; }
  p { margin:0 0 6px; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  button { background:#2a241d; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#1a1410; border-color:var(--accent); font-weight:600; }
  button.preset { text-align:left; width:calc(50% - 3px); }
  button.preset small { display:block; color:var(--muted); }
  button.preset.playing { outline:2px solid var(--accent); }
  label { display:flex; align-items:center; gap:8px; margin:4px 0; }
  label span { width:92px; color:var(--muted); }
  input[type=range] { flex:1; accent-color:var(--accent); }
  output { width:54px; text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone"><div class="guide" id="guide"></div><div class="hud"><span id="hudL"></span><span id="hudR"></span></div></div>
  <div class="panel">
    <h1>Zoom game</h1>
    <p>A finished scene: a room, a few objects and two characters. Pick what the camera looks at, then fire a zoom.</p>
    <h2>1 Look at (or click it in the picture)</h2>
    <div class="row" id="targets"></div>
    <h2>2 Place the camera</h2>
    <label><span>Around</span><input type="range" id="az" min="-180" max="180" value="0"><output id="azO"></output></label>
    <label><span>Height</span><input type="range" id="el" min="-20" max="60" value="5"><output id="elO"></output></label>
    <label><span>Distance</span><input type="range" id="dist" min="0.4" max="7" step="0.05" value="3"><output id="distO"></output></label>
    <h2>3 Fire a zoom (from the reference clip)</h2>
    <div class="row" id="presets"></div>
    <label><span>Strength</span><input type="range" id="str" min="0.25" max="1.5" step="0.05" value="1"><output id="strO"></output></label>
    <label><span>Speed</span><input type="range" id="spd" min="0.5" max="2" step="0.05" value="1"><output id="spdO"></output></label>
    <div class="row" style="margin-top:10px"><button id="guideBtn">Thirds grid</button><button id="reset">Reset camera</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="camera_logic.js"></script>
<script>
(async function () {
  const [spec, pre] = await Promise.all([fetch("scene_spec.json").then(r => r.json()), fetch("zoom_presets.json").then(r => r.json())]);
  const L = CameraLogic, presets = pre.presets;
  const $ = (id) => document.getElementById(id);
  const phone = $("phone");

  // ---------- renderer, camera (the reference's lens: 36.1 mm on a 36 mm tall sensor, 9:16)
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(360, 640); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  phone.insertBefore(renderer.domElement, phone.firstChild);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(L.vfov(spec.camera.lens_mm, spec.camera.sensor_h_mm) * 180 / Math.PI, spec.camera.aspect, 0.02, 60);

  // ---------- room
  const R = spec.room, W = R.x[1] - R.x[0], D = R.z[1] - R.z[0], cx = (R.x[0] + R.x[1]) / 2, cz = (R.z[0] + R.z[1]) / 2;
  const mat = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
  const add = (g, m, x, y, z, parent = scene) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); parent.add(o); return o; };
  add(new THREE.PlaneGeometry(W, D), mat(R.floor, 0.8), cx, 0, cz).rotation.x = -Math.PI / 2;
  add(new THREE.PlaneGeometry(W, D), mat(R.ceiling), cx, R.height, cz).rotation.x = Math.PI / 2;
  const wallM = mat(R.wall, 0.95), railM = mat(R.rail, 0.7);
  [[0, R.z[0], 0, W], [Math.PI, R.z[1], Math.PI, W]].forEach(([ry, z, _r, w]) => {
    const wall = add(new THREE.PlaneGeometry(w, R.height), wallM, cx, R.height / 2, z); wall.rotation.y = ry;
    const rail = add(new THREE.BoxGeometry(w, 0.12, 0.04), railM, cx, 1.15, z + (ry ? -0.02 : 0.02));
  });
  [[R.x[0], Math.PI / 2], [R.x[1], -Math.PI / 2]].forEach(([x, ry]) => {
    const wall = add(new THREE.PlaneGeometry(D, R.height), wallM, x, R.height / 2, cz); wall.rotation.y = ry;
    add(new THREE.BoxGeometry(0.04, 0.12, D), railM, x + (ry > 0 ? 0.02 : -0.02), 1.15, cz);
  });
  scene.add(new THREE.AmbientLight(0xffe9cc, 0.55));
  [[-2, -2], [1.5, -2], [0, 1.5]].forEach(([x, z]) => { const l = new THREE.PointLight(0xffc98a, 0.9, 9, 1.6); l.position.set(x, R.height - 0.3, z); scene.add(l); });

  // ---------- objects (each is a Group with userData.id and a focus point to look at)
  const objects = {};
  const reg = (id, label, group, focusY) => { group.userData = { id, label, focusY }; scene.add(group); objects[id] = group; };
  const cyl = (rt, rb, h, c, parent, x, y, z, seg = 14, m) => add(new THREE.CylinderGeometry(rt, rb, h, seg), m || mat(c), x, y, z, parent);

  spec.characters.forEach((c) => {
    const g = new THREE.Group(), H = c.height, skin = mat("#e3b79a", 0.7);
    cyl(0.07 * H / 1.5, 0.075 * H / 1.5, H * 0.48, c.pants, g, -0.09 * H / 1.5, H * 0.24, 0);
    cyl(0.07 * H / 1.5, 0.075 * H / 1.5, H * 0.48, c.pants, g, 0.09 * H / 1.5, H * 0.24, 0);
    cyl(0.16 * H / 1.5, 0.13 * H / 1.5, H * 0.34, c.shirt, g, 0, H * 0.65, 0);
    cyl(0.04 * H / 1.5, 0.04 * H / 1.5, H * 0.3, c.shirt, g, -0.21 * H / 1.5, H * 0.68, 0);
    cyl(0.04 * H / 1.5, 0.04 * H / 1.5, H * 0.3, c.shirt, g, 0.21 * H / 1.5, H * 0.68, 0);
    add(new THREE.SphereGeometry(0.095 * H / 1.5, 20, 16), skin, 0, H * 0.88, 0, g);
    if (c.id === "boy") { for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; add(new THREE.SphereGeometry(0.05, 10, 8), mat(c.hair, 0.6), Math.cos(a) * 0.07, H * 0.94 + (i % 2) * 0.02, Math.sin(a) * 0.07, g); } add(new THREE.SphereGeometry(0.085, 14, 10), mat(c.hair, 0.6), 0, H * 0.95, 0, g); }
    else { add(new THREE.SphereGeometry(0.1 * H / 1.5, 16, 12), mat(c.hair, 0.6), 0, H * 0.9, -0.025, g); cyl(0.1, 0.09, H * 0.34, c.hair, g, 0, H * 0.72, -0.075, 12); }
    g.position.set(c.pos[0], 0, c.pos[1]); g.rotation.y = c.facing_deg * Math.PI / 180;
    reg(c.id, c.label, g, H * 0.82);
  });

  const gold = mat("#d6a640", 0.35, 0.8), bone = mat("#cfc3a6", 0.8), stone = mat("#8d8a83", 0.9);
  spec.props.forEach((p) => {
    const g = new THREE.Group(); let fy = 0.5;
    if (p.kind === "stanchion") { cyl(0.14, 0.16, 0.04, 0, g, 0, 0.02, 0, 24, gold); cyl(0.025, 0.025, 0.95, 0, g, 0, 0.5, 0, 10, gold); add(new THREE.SphereGeometry(0.06, 14, 10), gold, 0, 1.0, 0, g); fy = 0.9; }
    if (p.kind === "plinth") { add(new THREE.BoxGeometry(p.size[0], 0.3, p.size[1]), stone, 0, 0.15, 0, g); add(new THREE.BoxGeometry(p.size[0] * 0.6, 0.5, p.size[1] * 0.6), mat("#b3b0a8", 0.9), 0, 0.55, 0, g); fy = 0.6; }
    if (p.kind === "bench") { add(new THREE.BoxGeometry(p.size[0], 0.08, p.size[1]), mat("#5a3a22", 0.7), 0, 0.45, 0, g); [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => cyl(0.03, 0.03, 0.42, 0, g, a * (p.size[0] / 2 - 0.05), 0.21, b * (p.size[1] / 2 - 0.08), 8, mat("#2d2d2d", 0.5, 0.6))); fy = 0.45; }
    if (p.kind === "rex_leg") { const f = cyl(0.16, 0.12, 1.5, 0, g, 0, 1.3, 0, 14, bone); f.rotation.z = 0.12; const s = cyl(0.1, 0.07, 1.2, 0, g, 0.1, 0.55, 0, 12, bone); s.rotation.z = -0.1; [-0.2, 0, 0.2].forEach((x) => { const t = cyl(0.04, 0.02, 0.45, 0, g, x + 0.1, 0.06, 0.28, 8, bone); t.rotation.x = Math.PI / 2.4; }); add(new THREE.BoxGeometry(0.6, 0.06, 0.8), mat("#3a3631", 0.9), 0.1, 0.03, 0.1, g); fy = 0.9; }
    if (p.kind === "rex_ribs") { cyl(0.05, 0.05, p.size[0], 0, g, 0, 1.9, 0, 10, bone).rotation.z = Math.PI / 2; for (let i = 0; i < 6; i++) { const t = add(new THREE.TorusGeometry(0.55, 0.035, 8, 20, Math.PI), bone, -p.size[0] / 2 + 0.3 + i * (p.size[0] - 0.6) / 5, 1.9, 0, g); t.rotation.z = Math.PI; } fy = 1.6; }
    g.position.set(p.pos[0], 0, p.pos[1]);
    reg(p.id, p.label, g, fy);
  });
  spec.ropes.forEach((r) => {
    const a = objects[r.from].position, b = objects[r.to].position;
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(a.x, 0.92, a.z), new THREE.Vector3((a.x + b.x) / 2, 0.8, (a.z + b.z) / 2), new THREE.Vector3(b.x, 0.92, b.z)]);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.022, 6, false), mat("#a3171d", 0.6)));
  });

  // ---------- camera state and controls
  const state = { target: "boy", az: 0, el: 5, dist: 3 };
  const clickable = Object.values(objects);
  const tgtRow = $("targets");
  Object.values(objects).forEach((o) => { const b = document.createElement("button"); b.textContent = o.userData.label; b.dataset.id = o.userData.id; b.onclick = () => setTarget(o.userData.id); tgtRow.appendChild(b); });
  function setTarget(id) { state.target = id; [...tgtRow.children].forEach((b) => b.classList.toggle("on", b.dataset.id === id)); }
  setTarget("boy");
  const sliders = { az: "azO", el: "elO", dist: "distO" };
  const fmt = { az: (v) => v + "°", el: (v) => v + "°", dist: (v) => (+v).toFixed(2) + " m" };
  Object.keys(sliders).forEach((k) => { $(k).oninput = () => { state[k] = +$(k).value; }; });
  const syncUI = () => Object.keys(sliders).forEach((k) => { $(k).value = state[k]; $(sliders[k]).textContent = fmt[k](Math.round(state[k] * 100) / 100); });
  ["str", "spd"].forEach((k) => { $(k).oninput = () => { $(k + "O").textContent = "x" + (+$(k).value).toFixed(2); }; $(k).oninput(); });
  $("guideBtn").onclick = () => { $("guide").style.display = $("guide").style.display === "none" ? "" : "none"; }; $("guide").style.display = "none";
  $("reset").onclick = () => { Object.assign(state, { az: 0, el: 5, dist: 3 }); active = null; };

  // click a thing in the picture to look at it
  const ray = new THREE.Raycaster();
  renderer.domElement.addEventListener("click", (e) => {
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), cam);
    const hit = ray.intersectObjects(clickable, true)[0];
    if (hit) { let o = hit.object; while (o && !(o.userData && o.userData.id)) o = o.parent; if (o) setTarget(o.userData.id); }
  });

  // ---------- zoom presets
  let active = null;
  const pRow = $("presets");
  presets.forEach((p) => {
    const b = document.createElement("button"); b.className = "preset"; b.dataset.id = p.id;
    const sign = p.size_pct > 0 ? "+" : "";
    b.innerHTML = `${p.label}<small>${sign}${Math.round(p.size_pct)}% in ${p.dur_s.toFixed(2)} s (ref ${p.start_s.toFixed(1)} s)</small>`;
    b.onclick = () => {
      const n = L.framesFor(p, 1 / +$("spd").value);                       // Speed x2 = half the time
      active = { p, n, curve: L.zoomCurve(p, n, +$("str").value), d0: state.dist, t0: performance.now() };
      [...pRow.children].forEach((x) => x.classList.toggle("playing", x === b));
    };
    pRow.appendChild(b);
  });

  // ---------- loop
  const focus = new THREE.Vector3();
  function frame(now) {
    if (active) {
      const k = Math.min(active.n - 1, Math.floor((now - active.t0) / 1000 * L.FPS));
      state.dist = Math.max(0.3, active.d0 / active.curve[k]);
      if (k >= active.n - 1) { active = null; [...pRow.children].forEach((x) => x.classList.remove("playing")); }
    }
    const o = objects[state.target];
    focus.set(o.position.x, o.userData.focusY, o.position.z);
    const [x, y, z] = L.around([focus.x, focus.y, focus.z], state.az, state.el, state.dist);
    cam.position.set(x, Math.max(0.05, y), z); cam.lookAt(focus);
    renderer.render(scene, cam);
    $("hudL").textContent = o.userData.label;
    $("hudR").textContent = state.dist.toFixed(2) + " m" + (active ? "  zooming" : "");
    syncUI();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
